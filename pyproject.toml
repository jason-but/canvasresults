[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "canvasresults"
version = "0.0.1"
authors = [
  { name="Jason But", email="jbut@swin.edu.au" },
]
description = "Pending"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = ["canvasapi", "pydantic"]

[project.urls]
Homepage = "https://github.com/jason-but/canvasresults"
Issues = "https://github.com/jason-but/canvasresults/issues"

[tool.setuptools.packages.find]
where =   ["."]
include = ["canvasresults*"]
